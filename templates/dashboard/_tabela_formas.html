{% load formatacao %}
{% if formas %}
<div class="table-responsive">
  <table class="table table-sm table-hover align-middle mb-0">
    <thead class="table-light">
      <tr><th>Forma</th><th class="text-center">Vendas</th><th class="text-end">Valor</th><th class="text-end">Participação</th></tr>
    </thead>
    <tbody>
      {% for f in formas %}
      <tr>
        <td>{{ f.nome }}</td>
        <td class="text-center">{{ f.quantidade }}</td>
        <td class="text-end text-nowrap">{{ f.valor|moeda }}</td>
        <td class="text-end">{{ f.participacao|percentual }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<p class="text-muted p-3 mb-0">Nenhuma venda no período.</p>
{% endif %}
