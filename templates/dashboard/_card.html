<div class="{{ col|default:'col-12 col-sm-6 col-xl-4' }}">
  <div class="card shadow-sm border-0 border-start border-4 border-{{ cor }} h-100">
    <div class="card-body d-flex align-items-center">
      <div class="flex-grow-1">
        <div class="text-muted small text-uppercase fw-semibold">{{ titulo }}</div>
        <div class="fs-4 fw-bold text-nowrap">{{ valor }}</div>
        {% if detalhe %}<div class="small text-muted">{{ detalhe }}</div>{% endif %}
      </div>
      <i class="bi bi-{{ icone }} fs-1 text-{{ cor }} opacity-50"></i>
    </div>
  </div>
</div>
