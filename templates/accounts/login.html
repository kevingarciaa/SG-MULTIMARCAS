{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card shadow-sm login-card w-100">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-shop display-5 text-primary"></i>
        <h1 class="h4 mt-2 mb-0">SG Multimarcas</h1>
        <p class="text-muted small">Sistema de gestão da loja</p>
      </div>

      {% if form.non_field_errors %}
      <div class="alert alert-danger py-2">Usuário ou senha incorretos.</div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
          {{ form.username }}
        </div>
        <div class="mb-4">
          <label class="form-label" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
